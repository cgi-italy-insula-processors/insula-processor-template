name: Validate template

# Renders the cookiecutter with its default answers and checks the scaffolded CWL
# still obeys the Insula Application Package contract (one Workflow + one
# CommandLineTool, a dockerPull, exactly one __IMAGE__ token). Without this the
# template's `{{ }}` files are never exercised and a restyle could silently break
# every scaffolded processor (and the CLI's _lint_cwl / the launcher finalize).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Render the template and check the scaffolded CWL
        run: |
          python -m pip install --quiet cookiecutter pyyaml
          OUT="$(mktemp -d)"
          cookiecutter --no-input --output-dir "$OUT" .
          # processor_name default "My EO Processor" -> slug "my-eo-processor".
          SLUG="my-eo-processor"
          CWL="$OUT/$SLUG/$SLUG.cwl"
          [ -f "$CWL" ] || { echo "::error::scaffolded CWL not found at $CWL"; exit 1; }
          python - "$CWL" <<'PY'
          """Check the scaffolded CWL against the Application Package contract.

          Parses the YAML rather than grepping it, for two reasons a grep gets wrong:
          `grep -c` counts matching LINES, not occurrences, so two tokens on one line
          read as one; and a grep counts the header comment that documents __IMAGE__
          by name. The token is counted here the way the builder-cli's cwlcheck counts
          it - in the PARSED document's keys and values - because that is exactly what
          the launcher's global `sed` substitution rewrites into a real image
          reference. A comment naming the token is rewritten harmlessly.
          """
          import sys

          import yaml

          TOKEN = "__IMAGE__"


          def count_tokens(node):
              if isinstance(node, str):
                  return node.count(TOKEN)
              if isinstance(node, dict):
                  return sum(count_tokens(k) + count_tokens(v) for k, v in node.items())
              if isinstance(node, list):
                  return sum(count_tokens(item) for item in node)
              return 0


          with open(sys.argv[1], encoding="utf-8") as handle:
              document = yaml.safe_load(handle)

          problems = []
          graph = document.get("$graph") if isinstance(document, dict) else None
          if not isinstance(graph, list):
              problems.append("the scaffolded CWL declares no '$graph' list")
              graph = []

          workflows = [e for e in graph if isinstance(e, dict) and e.get("class") == "Workflow"]
          tools = [e for e in graph if isinstance(e, dict) and e.get("class") == "CommandLineTool"]
          if len(workflows) != 1:
              problems.append(f"expected 1 'class: Workflow', found {len(workflows)}")
          if len(tools) != 1:
              problems.append(f"expected 1 'class: CommandLineTool', found {len(tools)}")

          docker_pull = None
          if len(tools) == 1:
              requirements = tools[0].get("requirements")
              docker = requirements.get("DockerRequirement") if isinstance(requirements, dict) else None
              docker_pull = docker.get("dockerPull") if isinstance(docker, dict) else None
          if not isinstance(docker_pull, str):
              problems.append("missing DockerRequirement.dockerPull")
          elif docker_pull.strip() != TOKEN:
              problems.append(f"dockerPull must be exactly {TOKEN}, found '{docker_pull}'")

          found = count_tokens(document)
          if found != 1:
              problems.append(f"expected exactly 1 {TOKEN} token in keys and values, found {found}")

          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print("scaffolded CWL passed structural checks")
          PY
