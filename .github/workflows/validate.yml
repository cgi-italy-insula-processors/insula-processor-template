name: Validate template

# Renders the cookiecutter with its default answers and checks the scaffolded CWL
# still obeys the Insula Application Package contract (one Workflow + one
# CommandLineTool, a dockerPull, exactly one __IMAGE__ token). Without this the
# template's `{{ }}` files are never exercised and a restyle could silently break
# every scaffolded processor (and the CLI's _lint_cwl / the launcher finalize).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Render the template and check the scaffolded CWL
        run: |
          python -m pip install --quiet cookiecutter
          OUT="$(mktemp -d)"
          cookiecutter --no-input --output-dir "$OUT" .
          # processor_name default "My EO Processor" -> slug "my-eo-processor".
          SLUG="my-eo-processor"
          CWL="$OUT/$SLUG/$SLUG.cwl"
          [ -f "$CWL" ] || { echo "::error::scaffolded CWL not found at $CWL"; exit 1; }
          fail=0
          w=$(grep -c 'class: Workflow' "$CWL" || true)
          c=$(grep -c 'class: CommandLineTool' "$CWL" || true)
          img=$(grep -c '__IMAGE__' "$CWL" || true)
          [ "$w" -eq 1 ] || { echo "::error::expected 1 'class: Workflow', found $w"; fail=1; }
          [ "$c" -eq 1 ] || { echo "::error::expected 1 'class: CommandLineTool', found $c"; fail=1; }
          [ "$img" -eq 1 ] || { echo "::error::expected exactly 1 __IMAGE__ token, found $img"; fail=1; }
          grep -q 'dockerPull' "$CWL" || { echo "::error::missing DockerRequirement.dockerPull"; fail=1; }
          [ "$fail" -eq 0 ] && echo "scaffolded CWL passed structural checks"
          exit "$fail"
